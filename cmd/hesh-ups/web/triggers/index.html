<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>hesh-ups triggers</title>
    <link rel="icon" type="image/png" href="/composer/favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="admin">
    <div id="down-banner" hidden>
      <div id="down-msg" role="status">Error: hesh-ups application not running!</div>
    </div>
    <header id="bar">
      <div class="bar-brand-wrap">
        <img src="/composer/favicon.png" alt="" />
        <span class="bar-brand"><span class="hesh">hesh</span>-<span class="ups">ups</span></span>
        <span class="win-title">
          <svg class="icon" aria-hidden="true"><use href="/composer/icons.svg#tabler-player-play"></use></svg>
          Triggers
        </span>
      </div>
      <span id="bar-status" role="status"></span>
      <button type="button" id="btn-fire-all">
        <svg class="icon" aria-hidden="true"><use href="/composer/icons.svg#tabler-player-play"></use></svg>
        Fire all
      </button>
      <button type="button" id="btn-stop-all">
        <svg class="icon" aria-hidden="true"><use href="/composer/icons.svg#tabler-x"></use></svg>
        Stop all
      </button>
    </header>
    <div id="desk">
      <main id="list" aria-label="Slots"></main>
      <p id="empty" hidden>
        <svg class="icon" aria-hidden="true"><use href="/composer/icons.svg#tabler-stack-2"></use></svg>
        No fireable slots. Add them in the composer.
      </p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
