<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Composer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Composer</h1>
      <button type="button" id="btn720">720p</button>
      <button type="button" id="btn1080">1080p</button>
      <label><input type="checkbox" id="grid-thirds" /> thirds</label>
      <label><input type="checkbox" id="grid-center" /> center</label>
      <label><input type="checkbox" id="grid-safe" /> safe</label>
      <label><input type="checkbox" id="snap" checked /> Snap</label>
      <button type="button" id="copy-overlay">Copy overlay URL</button>
      <span id="obs-pill" class="pill">OBS: disconnected</span>
    </header>
    <div class="panes">
      <aside class="layers">
        <div class="layers-head">
          <span>Layers</span>
          <button type="button" id="add-slot">+</button>
        </div>
        <ul id="layer-list"></ul>
      </aside>
      <div class="stage-wrap">
        <div id="stage">
          <svg id="grid"></svg>
          <div id="boxes"></div>
        </div>
        <p id="empty-hint" class="hint">Add a slot to start.</p>
      </div>
      <aside class="inspector" id="inspector">
        <p class="muted">Select a slot</p>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
